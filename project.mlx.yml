name: MiloMLXValidation
options:
  minimumXcodeGenVersion: "2.38.0"
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
packages:
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.3
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 2.31.3
targets:
  MiloMLXValidation:
    type: application
    platform: iOS
    sources: [MiloMLXValidation]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minjung.milolab
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Milo Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: mlx-swift
        product: MLX
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
  MiloMLXValidationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MiloMLXValidationTests]
    dependencies:
      - target: MiloMLXValidation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MiloMLXValidation:
    build:
      targets:
        MiloMLXValidation: all
    test:
      targets: [MiloMLXValidationTests]
