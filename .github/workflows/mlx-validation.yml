name: MLX validation app
on:
  push:
    branches: [feat/mlx-runtime-validation]
    paths:
      - "MiloMLXValidation/**"
      - "MiloMLXValidationTests/**"
      - "scripts/mlx-validation/**"
      - "project.mlx.yml"
      - ".github/workflows/mlx-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4 (Swift 6.1)
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Pure logic tests
        run: scripts/mlx-validation/test-portable.sh
      - name: Generate independent project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.mlx.yml
      - name: Compile for device
        run: |
          set -o pipefail
          xcodebuild -project MiloMLXValidation.xcodeproj -scheme MiloMLXValidation -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build-mlx CODE_SIGNING_ALLOWED=NO build | tee mlx-build.log
      - name: Package unsigned validation IPA
        run: |
          mkdir -p mlx-package/Payload
          cp -R build-mlx/Build/Products/Release-iphoneos/MiloMLXValidation.app mlx-package/Payload/
          cd mlx-package
          zip -qry ../MiloLab-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MiloLab-validation
          path: |
            MiloLab-unsigned.ipa
            mlx-build.log
